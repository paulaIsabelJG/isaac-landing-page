<section id="ciclo-sistema" class="cycle">
  <div class="container">
    <app-section-title
      title="El ciclo de ISAAC"
      description="Crear, personalizar, comunicar, registrar, analizar y volver a mejorar."
      align="center"
      maxWidth="480px"
    />

    <div class="cycle__diagram">
      <ol class="cycle__row">
        @for (step of steps; track step.id) {
          <li class="cycle__step" [class]="'cycle__step--' + step.accent">
            <a
              class="cycle__link"
              [href]="'#' + step.anchor"
              (click)="onStepClick($event, step.anchor)"
            >
              <span class="cycle__circle">
                <svg [lucideIcon]="iconFor(step.icon)" class="cycle__icon" aria-hidden="true"></svg>
                <span class="cycle__number" aria-hidden="true">{{ step.number }}</span>
              </span>
              <span class="cycle__label">{{ step.shortTitle }}</span>
            </a>
          </li>
        }
      </ol>

      <span class="cycle__loop-bracket" aria-hidden="true"></span>
    </div>

    <p class="cycle__loop-note">
      <svg lucideRepeat2 aria-hidden="true"></svg>
      <span>El ciclo vuelve de <strong>Objetivos</strong> a <strong>Personalizar</strong> para seguir adaptando el sistema.</span>
    </p>
  </div>
</section>
