<section id="features" class="features">
  <div class="container">
    <app-section-title
      eyebrow="Funcionalidades"
      title="Todo lo que necesitas, en una única plataforma"
      description="ISAAC reúne creación de tableros, comunicación, personalización, inteligencia artificial y seguimiento sin obligar a trabajar con herramientas separadas."
      align="center"
      maxWidth="640px"
    />

    <div class="features__layout">
      <div class="features__scenes">
        @for (feature of features; track feature.id) {
          <app-feature-scene [feature]="feature" [total]="total" />
        }
      </div>

      <app-feature-visual [feature]="activeFeature()" [features]="features" />
    </div>
  </div>
</section>
