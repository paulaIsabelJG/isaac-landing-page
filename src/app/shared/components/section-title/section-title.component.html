<div
  class="section-title"
  [class.section-title--center]="align() === 'center'"
  [style.max-width]="maxWidth()"
>
  @if (eyebrow()) {
    <p class="eyebrow">{{ eyebrow() }}</p>
  }

  @switch (headingLevel()) {
    @case (1) {
      <h1 class="section-title__heading">{{ title() }}</h1>
    }
    @case (3) {
      <h3 class="section-title__heading">{{ title() }}</h3>
    }
    @default {
      <h2 class="section-title__heading">{{ title() }}</h2>
    }
  }

  @if (description()) {
    <p class="section-title__description">{{ description() }}</p>
  }
</div>
